# 经济日历定时推送（GitHub Actions）
#
# 放置位置：<你的 TrendRadar fork>/.github/workflows/econ-calendar.yml
# 配套脚本：econ_calendar.py（放在仓库根目录）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   WEWORK_WEBHOOK_URL ：企业微信 Webhook（可直接复用 TrendRadar 已配置的那个）
# 可选：
#   WEWORK_MSG_TYPE    ：text（个人微信）| markdown（群机器人，推荐）
#
# 数据源：ForexFactory 社区 JSON（免费、免 Key，不含「实际值」）。

name: 经济日历推送

on:
  schedule:
    # 时间为 UTC；北京时间每天 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  econ-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取经济日历并推送企业微信
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        run: python econ_calendar.py --days 1 --impact high medium --msg-type markdown --push-wework
